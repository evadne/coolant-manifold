<text x="1494.5100000000002" y="341.45" font-size="17" text-anchor="start" fill="#193343">87</text>
<text x="60" y="525" font-size="22" text-anchor="start" fill="#193343">8 × Ø4.5 +0.10/0 THRU · Ø8 +0.10/0 × 90° countersink on outside face</text>
<text x="60" y="555" font-size="17" text-anchor="start" fill="#193343">Black outlines = CUT DXF geometry. Blue circles = machined countersinks; not laser-cut circles.</text>
<line x1="60" y1="578" x2="1540" y2="578" stroke="#596a75" stroke-width="1" stroke-dasharray=""/>
<text x="60" y="614" font-size="21" text-anchor="start" fill="#193343">HOLE CENTRES / X, Z</text>
<text x="60" y="647" font-size="17" text-anchor="start" fill="#193343">8 M4 holes: X = −208 and 208; Z = 9, 43.5 and 78 (6 holes)</text>
<text x="60" y="676" font-size="17" text-anchor="start" fill="#193343">Plus X = −67.5 and 67.5; Z = 43.5 (2 holes)</text>
<text x="60" y="705" font-size="17" text-anchor="start" fill="#193343">18 × Ø32 +0.20/0 windows: X = −180 to 180 at 45 pitch;</text>
<text x="60" y="734" font-size="17" text-anchor="start" fill="#193343">Z = 23.5 and 63.5 (9 windows per row)</text>
<text x="60" y="763" font-size="17" text-anchor="start" fill="#193343">4 slots: 10 × 7 overall, R3.5 ends; X = ±232.55;</text>
<text x="60" y="792" font-size="17" text-anchor="start" fill="#193343">Z = 5.4 and 81.6. Rack fixing centres 465.1 horizontally.</text>
<text x="1040" y="614" font-size="21" text-anchor="start" fill="#193343">TYPICAL M4 SECTION</text>
<polygon points="1137,647 1194.0,647 1227.25,680.25 1227.25,704.0 1137,704.0" fill="#d7e0e4" stroke="#193343"/>
<polygon points="1403,647 1346.0,647 1312.75,680.25 1312.75,704.0 1403,704.0" fill="#d7e0e4" stroke="#193343"/>
<text x="1270" y="637" font-size="16" text-anchor="middle" fill="#193343">Ø8 / 90°</text>
<text x="1270" y="729.0" font-size="16" text-anchor="middle" fill="#193343">Ø4.5 through</text>
<text x="1040" y="761" font-size="17" text-anchor="start" fill="#193343">Cone depth 1.75 nominal</text>
<text x="1040" y="788" font-size="17" text-anchor="start" fill="#193343">Straight bore 1.25 nominal</text>
<text x="1040" y="817" font-size="17" text-anchor="start" fill="#193343">No countersink on POM-facing side</text>
<line x1="60" y1="842" x2="1540" y2="842" stroke="#596a75" stroke-width="1" stroke-dasharray=""/>
<text x="60" y="878" font-size="17" text-anchor="start" fill="#193343">Punch or laser-cut outline and through holes. Finish holes as needed; machine countersinks afterwards. No bending.</text>
<text x="60" y="906" font-size="17" text-anchor="start" fill="#193343">Hole/window centres ±0.10 relative to bottom-centre datum; other dimensions ±0.15 unless specified.</text>
<text x="60" y="934" font-size="17" text-anchor="start" fill="#193343">Deburr and flatten after cutting. External edges: break 0.3–0.5; do not enlarge specified bores or countersinks.</text>
<text x="60" y="962" font-size="17" text-anchor="start" fill="#193343">A4 M4 × 12 DIN 7991 socket countersunk screws; specified DIN 965 Z Pozi accepted. Threads are in POM only.</text>
<text x="60" y="990" font-size="17" text-anchor="start" fill="#193343">Dry structural plate. Eighteen windows clear the integral POM bosses; fittings seal directly on their raised ends.</text>
<text x="60" y="1018" font-size="17" text-anchor="start" fill="#193343">Rack slots take fixings matching the actual rails/cage nuts; the M4 specification applies to plate-to-POM joints.</text>
<text x="60" y="1090" font-size="17" text-anchor="start" fill="#a4502c">DRAFT FOR VENDOR DFM / NOT A PRESSURE OR STRUCTURAL RELEASE</text>
<text x="1540" y="1090" font-size="16" text-anchor="end" fill="#193343">faceplate-flat.dxf + faceplate.step</text>
</g></svg>
