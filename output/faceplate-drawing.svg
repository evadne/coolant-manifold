<text x="60" y="94" font-size="18" text-anchor="start" fill="#193343">Geometry revision G · Selected Option B · 1 required · All dimensions in mm · Do not scale</text>
<text x="60" y="128" font-size="18" text-anchor="start" fill="#193343">304 or 316 stainless · 3.00 ±0.10 FINISHED thickness</text>
<text x="60" y="162" font-size="17" text-anchor="start" fill="#193343">Outside face shown; countersink this face. Opposite face mates to POM.</text>
