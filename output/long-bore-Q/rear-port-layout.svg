<text x="65" y="550" font-size="23" text-anchor="start">4 × G1/4 BSPP FEMALE — ISO 228-1, FITTING O-RING FACE SEAL</text>
<text x="65" y="595" font-size="20" text-anchor="start">Centres: X −180 / +180; Z 23.5 / 63.5. Flat rear sealing face at Y40.</text>
<text x="65" y="629" font-size="20" text-anchor="start">Pilot Ø11.80 × 20 full diameter from rear face, to gallery axis Y20; 118° drill point.</text>
<text x="65" y="663" font-size="20" text-anchor="start">Entry Ø13.80 × 1 deep; full thread 8 minimum AFTER entry (9 minimum from face).</text>
<text x="65" y="697" font-size="20" text-anchor="start">Preserve a flat Ø28 sealing land around each port. Dashed circles are reference lands, not grooves.</text>
<text x="65" y="731" font-size="20" text-anchor="start">No rear bosses. No rear cover. Existing 40 mm slab and 3 mm front bosses retained.</text>
<text x="65" y="765" font-size="20" text-anchor="start">Each rear port joins the gallery of the front port directly opposite it; two wet networks total.</text>
<text x="65" y="799" font-size="20" text-anchor="start">Unused ports require G1/4 face-sealing plugs. External deburr only; clean and flush internal bores.</text>
<text x="65" y="833" font-size="20" text-anchor="start">Threads in STEP are pilot cylinders, not finished plain bores. This sheet is not a supplier release.</text>
<text x="65" y="904" font-size="17" text-anchor="start">Rear view reverses left/right relative to the front. Coordinate signs use the existing P datum.</text>
</g></svg>