<text x="565" y="485" text-anchor="start" font-size="18">White recesses: blind M4 pilot holes at X0.</text>
<text x="565" y="539" text-anchor="start" font-size="20">Side ports are centred in the body depth.</text>
<text x="565" y="570" text-anchor="start" font-size="18">Ø22 sealing lands have 6.5 mm edge reserve</text>
<text x="565" y="597" text-anchor="start" font-size="18">to both the front and rear of the side face.</text>
