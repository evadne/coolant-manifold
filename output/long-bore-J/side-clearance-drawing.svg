<text x="800.0" y="256" font-size="18" text-anchor="middle" fill="#193343">450 POM body</text>
<line x1="127.42999999999995" y1="529.95" x2="1472.5700000000002" y2="529.95" stroke="#627480" stroke-width="1.3" stroke-dasharray=""/>
<line x1="127.42999999999995" y1="522.95" x2="127.42999999999995" y2="536.95" stroke="#627480" stroke-width="1.3" stroke-dasharray=""/>
<line x1="1472.5700000000002" y1="522.95" x2="1472.5700000000002" y2="536.95" stroke="#627480" stroke-width="1.3" stroke-dasharray=""/>
<text x="800.0" y="517.95" font-size="18" text-anchor="middle" fill="#193343">507.6 across fitted body (nominal)</text>
<text x="60" y="618" font-size="21" text-anchor="start" fill="#193343">Drawing-derived side projection: max(26.8, 17.8 + Ø22/2) = 28.8 mm.</text>
<text x="60" y="656" font-size="17" text-anchor="start" fill="#193343">17.8 mm outlet-centre height is inferred as 8.8 + 18/2 from the supplied BP-90R drawing.</text>
<text x="60" y="691" font-size="18" text-anchor="start" fill="#193343">Compression fitting adds 12.2 mm rearwards; its Ø22 body sets the lateral limit.</text>
<text x="60" y="726" font-size="18" text-anchor="start" fill="#193343">With 4 mm plug heads: 458 mm across body. With 30 mm allowances: 510 mm.</text>
<text x="60" y="769" font-size="18" text-anchor="start" fill="#a44b32">Fittings exceed the assumed opening by 28.8 mm per side; plugs exceed it by 4 mm.</text>
<text x="60" y="811" font-size="18" text-anchor="start" fill="#193343">The 482.6 mm faceplate sits in front of the opening; it is not part of the insertion-width budget.</text>
<text x="60" y="847" font-size="17" text-anchor="start" fill="#193343">These are fitting envelopes, not exact supplier solids. Tubes, bend radius, tolerances and rail geometry are excluded.</text>
<text x="60" y="883" font-size="17" text-anchor="start" fill="#193343">Four side ports share these two top-view silhouettes. Shown outlets point rearwards; other angles need review.</text>
<text x="60" y="919" font-size="17" text-anchor="start" fill="#193343">Angled insertion and final installed clearance require an actual rack check; no insertion path is validated here.</text>
<text x="60" y="1018" font-size="16" text-anchor="start" fill="#193343">REVISION J / User-supplied BP-90R and Barrow drawings / nominal envelope study</text>
</g></svg>
