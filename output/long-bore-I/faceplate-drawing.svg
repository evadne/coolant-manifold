<text x="60" y="565" font-size="17" text-anchor="start" fill="#193343">16 × Ø32 +0.20/0 windows. Rows Z = 23.5 / 63.5. X = -157.5, -112.5, -67.5, -22.5, 22.5, 67.5, 112.5, 157.5</text>
<text x="60" y="600" font-size="19" text-anchor="start" fill="#193343">6 × Ø4.5 +0.10/0 through; Ø8.0 +0.10/0 × 90° countersink, outside face.</text>
<text x="60" y="636" font-size="18" text-anchor="start" fill="#193343">M4 centres: X = -178, 0, 178; each at Z = 7 and 80.</text>
<text x="60" y="672" font-size="18" text-anchor="start" fill="#193343">Datum: X = 0 at width centre; Z = 0 at bottom. Plate height 87. Hole/window centres ±0.10.</text>
<text x="60" y="708" font-size="18" text-anchor="start" fill="#193343">Four 10 × 7 rack slots, R3.5 ends: X = ±232.55; Z = 5.4 / 81.6. Other dimensions ±0.15.</text>
<text x="60" y="759" font-size="18" text-anchor="start" fill="#193343">CUT DXF contains outline, port windows, screw through holes and rack slots only.</text>
<text x="60" y="794" font-size="18" text-anchor="start" fill="#193343">Machine countersinks after cutting; do not laser-cut the blue countersink circles.</text>
<text x="60" y="829" font-size="18" text-anchor="start" fill="#193343">304 or 316 stainless, dry structural plate. Deburr, flatten and inspect finished thickness.</text>
<text x="60" y="864" font-size="18" text-anchor="start" fill="#193343">Use A4 M4 × 12 DIN 7991 socket countersunk screws; specified DIN 965 Z Pozi accepted.</text>
<text x="60" y="899" font-size="17" text-anchor="start" fill="#193343">Dashed body edges are drawing references only. No surface text, lines or markings on the product.</text>
<text x="60" y="1018" font-size="16" text-anchor="start" fill="#193343">REVISION I / faceplate-flat.dxf + faceplate.step</text>
