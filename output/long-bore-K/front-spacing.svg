<text x="70" y="738" text-anchor="start" font-size="20">Twenty front G1/4 ports. Ø28 mm bosses. QD3 Ø23.7 mm pull-ring reference: 16.3 mm nominal gap.</text>
<text x="70" y="777" text-anchor="start" font-size="20">25 mm is centre-to-end distance; the nominal margin beyond each Ø28 boss plus R1 root is 10 mm.</text>
<text x="70" y="816" text-anchor="start" font-size="19">Four reusable side G1/4 ports remain. End fitting space is shown separately in the assembled views.</text>
